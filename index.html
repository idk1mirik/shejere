<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мое Шежере | Soft Heritage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/2.8.0/dom-to-image-more.min.js"></script>

    <div class="ambient-gradient ambient-left"></div>
    <div class="ambient-gradient ambient-right"></div>

    <div class="ui-wrapper">
        <header class="top-bar">
            <div class="brand-block">
                <h1 class="logo">SHEDJERE</h1>
                <p class="tagline" data-i18n="tagline">Семейная память в живом дереве</p>
            </div>

            <div class="search-container">
                <input type="text" id="treeSearch" class="neomorph-input" data-i18n-placeholder="searchPlaceholder" placeholder="Найти человека...">
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <div class="toolbar">
                <div id="languageSwitcher" class="segment-control" aria-label="Language">
                    <button class="segment-btn active" type="button" data-lang="ru">RU</button>
                    <button class="segment-btn" type="button" data-lang="uz">UZ</button>
                    <button class="segment-btn" type="button" data-lang="en">EN</button>
                </div>

                <div id="themePanel" class="theme-panel-header" aria-label="Theme"></div>

                <button id="exportBtn" class="glass-btn" type="button" data-i18n="exportPng">Скачать PNG</button>
                <button id="createPersonBtn" class="glass-btn primary" type="button" data-i18n="createPerson">Добавить человека</button>
            </div>
        </header>
    </div>

    <main class="canvas-area" aria-label="Родословное дерево">
        <svg id="viewport">
            <g id="scene"></g>
        </svg>
    </main>

    <div class="floating-mobile-tools">
        <div id="mobileThemePanel" class="mobile-theme-panel" aria-label="Theme"></div>

        <div class="mobile-zoom-controls" aria-label="Масштаб">
            <button id="zoomInBtn" class="glass-btn" type="button">+</button>
            <button id="zoomOutBtn" class="glass-btn" type="button">-</button>
        </div>
    </div>

    <aside id="personPanel" class="side-panel hidden">
        <div class="drag-handle"></div>
        <div class="panel-header">
            <img id="panelAvatar" class="avatar-big" src="" alt="">
            <button id="closePersonPanel" class="glass-btn icon-btn" type="button" aria-label="Закрыть">×</button>
        </div>

        <input
            type="text"
            id="personNameInput"
            class="neomorph-input main-name"
            data-i18n-placeholder="personNamePlaceholder"
            placeholder="Имя Фамилия"
        >

        <div class="quick-dates">
            <input type="text" id="quickBirth" class="neomorph-input small" data-i18n-placeholder="birthShort" placeholder="Рождение" readonly>
            <span class="dash">—</span>
            <input type="text" id="quickDeath" class="neomorph-input small" data-i18n-placeholder="deathShort" placeholder="Смерть" readonly>
        </div>

        <button id="openFullProfileBtn" class="glass-btn wide" type="button" data-i18n="openProfile">Открыть анкету</button>

        <div class="rel-section">
            <label data-i18n="addRelation">Добавить родство</label>
            <div class="rel-grid">
                <button id="addParent" class="rel-btn" type="button"><span>👵</span><span data-i18n="parent">Родитель</span></button>
                <button id="addSpouse" class="rel-btn" type="button"><span>💍</span><span data-i18n="spouse">Пара</span></button>
                <button id="addChild" class="rel-btn" type="button"><span>👶</span><span data-i18n="child">Ребенок</span></button>
            </div>
        </div>
    </aside>

    <div id="fullProfileModal" class="modal-overlay hidden">
        <div class="full-profile-card">
            <button class="close-x" id="closeFullProfile" type="button" aria-label="Закрыть">&times;</button>

            <div class="profile-layout">
                <div class="profile-photo-side">
                    <div class="avatar-big-wrapper" id="modalAvatarContainer">
                        <img id="modalAvatarPreview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Фото">
                        <label for="uploadPhoto" class="upload-badge" aria-label="Загрузить фото">
                            <span>📷</span>
                            <input type="file" id="uploadPhoto" hidden accept="image/*">
                        </label>
                    </div>
                    <p class="photo-hint" data-i18n="photoHint">Нажми на фото, чтобы загрузить новое</p>
                </div>

                <div class="profile-info-side">
                    <h2 class="profile-title" data-i18n="profileTitle">Информация о родственнике</h2>

                    <div class="flex-row">
                        <div class="flex-col flex-wide">
                            <label class="input-label" data-i18n="fullNameLabel">ФИО / полное имя</label>
                            <input type="text" id="fName" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label" data-i18n="maidenNameLabel">Девичья фамилия</label>
                            <input type="text" id="fMaidenName" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label" data-i18n="birthDateLabel">Дата рождения</label>
                            <div class="date-field">
                                <input type="text" id="fBirth" class="neomorph-input" data-i18n-placeholder="datePlaceholder" placeholder="дд.мм.гггг">
                                <button class="date-icon-btn" type="button" data-date-trigger="fBirth" aria-label="Open calendar">▦</button>
                            </div>
                        </div>
                        <div class="flex-col">
                            <div class="death-label-row">
                                <label class="input-label" data-i18n="deathDateLabel">Дата смерти</label>
                                <label class="alive-check"><input type="checkbox" id="fIsAlive"> <span data-i18n="isAlive">Жив(а)</span></label>
                            </div>
                            <div class="date-field">
                                <input type="text" id="fDeath" class="neomorph-input" data-i18n-placeholder="datePlaceholder" placeholder="дд.мм.гггг">
                                <button class="date-icon-btn" type="button" data-date-trigger="fDeath" aria-label="Open calendar">▦</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label" data-i18n="birthPlaceLabel">Место рождения</label>
                            <input type="text" id="fBirthPlace" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label" data-i18n="deathPlaceLabel">Место смерти / погребения</label>
                            <input type="text" id="fDeathPlace" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label" data-i18n="educationLabel">Образование</label>
                            <input type="text" id="fEdu" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label" data-i18n="professionLabel">Профессия</label>
                            <input type="text" id="fProf" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label" data-i18n="livingPlaceLabel">Место жительства</label>
                            <input type="text" id="fLiving" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label" data-i18n="burialLabel">Информация о захоронении</label>
                            <input type="text" id="fBurial" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-col">
                        <label class="input-label" data-i18n="bioLabel">Биография и интересные факты</label>
                        <textarea id="fBio" class="neomorph-input bio-input"></textarea>
                    </div>

                    <div class="profile-actions">
                        <button id="saveProfileBtn" class="glass-btn primary" type="button" data-i18n="saveChanges">Сохранить изменения</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modalTitle" data-i18n="newPersonTitle">Новый человек</h3>
            <div id="existingList" class="existing-list"></div>
            <div class="modal-hint" data-i18n="orCreateNew">или создай нового</div>
            <input type="text" id="newPersonName" class="neomorph-input" data-i18n-placeholder="newPersonPlaceholder" placeholder="Введите имя...">
            <div class="modal-actions">
                <button id="closeModalBtn" class="glass-btn" type="button" data-i18n="cancel">Отмена</button>
                <button id="submitModalBtn" class="glass-btn primary" type="button" data-i18n="create">Создать</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="system.js"></script>
    <script src="script.js"></script>
</body>
</html>
