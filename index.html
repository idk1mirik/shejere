<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мое Шежере | Soft Heritage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/2.8.0/dom-to-image-more.min.js"></script>

    <div class="ui-wrapper">
        <header class="top-bar">
            <h1 class="logo">🌳 SHEDJERE</h1>

            <div class="search-container">
                <input type="text" id="treeSearch" class="neomorph-input" placeholder="Найти человека...">
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <div class="toolbar">
                <button id="exportBtn" class="glass-btn">Скачать PNG</button>
                <button id="createPersonBtn" class="glass-btn primary">Добавить человека</button>
            </div>
        </header>
    </div>

    <main class="canvas-area" aria-label="Родословное дерево">
        <svg id="viewport">
            <g id="scene"></g>
        </svg>
    </main>

    <div class="mobile-zoom-controls" aria-label="Масштаб">
        <button id="zoomInBtn" class="glass-btn" type="button">+</button>
        <button id="zoomOutBtn" class="glass-btn" type="button">-</button>
    </div>

    <aside id="personPanel" class="side-panel hidden">
        <div class="drag-handle"></div>
        <div class="panel-header">
            <img id="panelAvatar" class="avatar-big" src="" alt="">
            <button id="closePersonPanel" class="glass-btn icon-btn" type="button" aria-label="Закрыть">×</button>
        </div>

        <input
            type="text"
            id="personNameInput"
            class="neomorph-input main-name"
            placeholder="Имя Фамилия"
        >

        <div class="quick-dates">
            <input type="text" id="quickBirth" class="neomorph-input small" placeholder="Рождение" readonly>
            <span class="dash">—</span>
            <input type="text" id="quickDeath" class="neomorph-input small" placeholder="Смерть" readonly>
        </div>

        <button id="openFullProfileBtn" class="glass-btn wide" type="button">Открыть анкету</button>

        <div class="rel-section">
            <label>Добавить родство</label>
            <div class="rel-grid">
                <button id="addParent" class="rel-btn" type="button"><span>👵</span>Родитель</button>
                <button id="addSpouse" class="rel-btn" type="button"><span>💍</span>Пара</button>
                <button id="addChild" class="rel-btn" type="button"><span>👶</span>Ребенок</button>
            </div>
        </div>
    </aside>

    <div id="fullProfileModal" class="modal-overlay hidden">
        <div class="full-profile-card">
            <button class="close-x" id="closeFullProfile" type="button" aria-label="Закрыть">&times;</button>

            <div class="profile-layout">
                <div class="profile-photo-side">
                    <div class="avatar-big-wrapper" id="modalAvatarContainer">
                        <img id="modalAvatarPreview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Фото">
                        <label for="uploadPhoto" class="upload-badge" aria-label="Загрузить фото">
                            <span>📷</span>
                            <input type="file" id="uploadPhoto" hidden accept="image/*">
                        </label>
                    </div>
                    <p class="photo-hint">Нажми на фото, чтобы загрузить новое</p>
                </div>

                <div class="profile-info-side">
                    <h2 class="profile-title">Информация о родственнике</h2>

                    <div class="flex-row">
                        <div class="flex-col flex-wide">
                            <label class="input-label">ФИО / полное имя</label>
                            <input type="text" id="fName" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label">Девичья фамилия</label>
                            <input type="text" id="fMaidenName" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label">Дата рождения</label>
                            <input type="text" id="fBirth" class="neomorph-input" placeholder="дд.мм.гггг">
                        </div>
                        <div class="flex-col">
                            <div class="death-label-row">
                                <label class="input-label">Дата смерти</label>
                                <label class="alive-check"><input type="checkbox" id="fIsAlive"> Жив(а)</label>
                            </div>
                            <input type="text" id="fDeath" class="neomorph-input" placeholder="дд.мм.гггг">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label">Место рождения</label>
                            <input type="text" id="fBirthPlace" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label">Место смерти / погребения</label>
                            <input type="text" id="fDeathPlace" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label">Образование</label>
                            <input type="text" id="fEdu" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label">Профессия</label>
                            <input type="text" id="fProf" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <label class="input-label">Место жительства</label>
                            <input type="text" id="fLiving" class="neomorph-input">
                        </div>
                        <div class="flex-col">
                            <label class="input-label">Информация о захоронении</label>
                            <input type="text" id="fBurial" class="neomorph-input">
                        </div>
                    </div>

                    <div class="flex-col">
                        <label class="input-label">Биография и интересные факты</label>
                        <textarea id="fBio" class="neomorph-input bio-input"></textarea>
                    </div>

                    <div class="profile-actions">
                        <button id="saveProfileBtn" class="glass-btn primary" type="button">Сохранить изменения</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modalTitle">Новый человек</h3>
            <div id="existingList" class="existing-list"></div>
            <div class="modal-hint">или создай нового</div>
            <input type="text" id="newPersonName" class="neomorph-input" placeholder="Введите имя...">
            <div class="modal-actions">
                <button id="closeModalBtn" class="glass-btn" type="button">Отмена</button>
                <button id="submitModalBtn" class="glass-btn primary" type="button">Создать</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="system.js"></script>
    <script src="script.js"></script>
</body>
</html>
